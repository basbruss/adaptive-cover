name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  pytest:
    name: "pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Python"
        uses: "actions/setup-python@v7.1.0"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # Only what the tests need: requirements.txt (Home Assistant, pandas)
      # plus pytest. The notebook/plotting tools in requirements-dev.txt are
      # not needed here.
      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest~=9.1" "pytest-asyncio~=1.4"

      - name: "Run tests"
        run: python -m pytest tests
